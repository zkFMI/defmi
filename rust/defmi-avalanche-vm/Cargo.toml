[package]
name = "defmi-avalanche-vm"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Non-EVM Avalanche custom VM for QOMM and DeFMI"

[features]
default = []
research-cocode = ["dep:zkfmi-cosnark-trial"]

[dependencies]
zkpi-defmi-sdk = { path = "../zkpi-defmi-sdk" }
zkfmi-crypto.workspace = true
zkfmi-cosnark-trial = { git = "https://github.com/zkFMI/zkfmi-crypto.git", rev = "9f95ffc0bb3206517ffadb70223f2ebbcad5e908", default-features = false, optional = true }
avalanche-rpcchainvm-qomm = { path = "../vendor/avalanche-rs-qomm/crates/avalanche-rpcchainvm" }
defmi.workspace = true
zkpi-committee.workspace = true
zkpi-proofs.workspace = true
zkfmi-zk.workspace = true
zkpi.workspace = true
curve25519-dalek.workspace = true
ed25519-dalek.workspace = true
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true
hex.workspace = true
thiserror.workspace = true
rand_core.workspace = true
rand_chacha = "=0.3.1"
tokio = { version = "1", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tonic = { version = "0.12", features = ["transport"] }
prost-types = "0.13"
bs58 = "0.5"
base64.workspace = true

[dev-dependencies]
zkfmi-crypto = { workspace = true, features = ["test-support"] }
tempfile = "3"
merlin.workspace = true

# The binary keeps the name AvalancheGo launch scripts and images expect.
[[bin]]
name = "qomm-avalanche-vm"
path = "src/main.rs"

[[bin]]
name = "cocode-canonical-acceptance"
path = "src/bin/cocode-canonical-acceptance.rs"
required-features = ["research-cocode"]
