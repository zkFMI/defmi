[workspace]
resolver = "2"
members = ["qomm-defmi","qomm-avalanche-vm","zkpi-defmi-sdk","qomm-harness"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
zkfmi-crypto = { git = "https://github.com/zkFMI/zkfmi-crypto.git", rev = "26ebfe96563a05c3379219f7fdacea137ab5fb4f" }
qomm-avalanche-vm = { path = "qomm-avalanche-vm" }
dekyx-core = { git = "https://github.com/zkFMI/dekyx.git", rev = "88a68b35fec4ec4ae332731bc2eae92fcf9aa30c" }
# Audited by Quarkslab (2019, commissioned by Tari Labs, 30 man-days) together
# with subtle and bulletproofs. 4.1.3 is the first release carrying the fix for
# RUSTSEC-2024-0344, a timing leak LLVM introduced into Scalar::sub, so the
# floor is not negotiable.
curve25519-dalek = { version = "4.1.3", features = ["rand_core", "digest"] }
bulletproofs = "5.0"
merlin = "3"
sha2 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
subtle = "2.5"
# Threshold Schnorr from the Zcash Foundation, partially audited by NCC Group
# (2023, v0.6.0). Replaces a hand-rolled threshold sigma protocol.
frost-ristretto255 = "3.0"
frost-core = "3.0"
# Ed25519 signatures for the KYB issuer. Same dalek assessment as the group.
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
base64 = "0.22"
hex = "0.4"
thiserror = "1"
rand = "0.8"
regex = "1.13.1"
openssl = { version = "=0.10.81", features = ["vendored"] }
libc = "0.2"
qomm-zk = { git = "https://github.com/zkFMI/zkpi.git", rev = "dc7778400a3dcc4e5cef8b9a8fc8ae69ad60d04c" }
qomm-zkpi = { git = "https://github.com/zkFMI/zkpi.git", rev = "dc7778400a3dcc4e5cef8b9a8fc8ae69ad60d04c" }
qomm-proofs = { git = "https://github.com/zkFMI/zkpi.git", rev = "dc7778400a3dcc4e5cef8b9a8fc8ae69ad60d04c" }
qomm-defmi = { path = "qomm-defmi" }
qomm-dsl = { git = "https://github.com/zkFMI/qomm.git", rev = "efde6fdc4946bdef2c21c6e66563560e801cbbee" }
qomm-sim = { git = "https://github.com/zkFMI/qomm.git", rev = "efde6fdc4946bdef2c21c6e66563560e801cbbee" }
qomm-measure = { git = "https://github.com/zkFMI/qomm.git", rev = "efde6fdc4946bdef2c21c6e66563560e801cbbee" }
qomm-mpc = { git = "https://github.com/zkFMI/qomm.git", rev = "efde6fdc4946bdef2c21c6e66563560e801cbbee" }
qomm-transport = { git = "https://github.com/zkFMI/qomm.git", rev = "efde6fdc4946bdef2c21c6e66563560e801cbbee" }
zkpi-defmi-sdk = { path = "zkpi-defmi-sdk" }
qomm-audit = { git = "https://github.com/zkFMI/qomm.git", rev = "efde6fdc4946bdef2c21c6e66563560e801cbbee" }

# Unpublished integration overlay; see zkfmi-crypto/docs/INTEGRATION_SOURCES.json.
[patch."https://github.com/zkFMI/qomm.git"]
qomm-dsl = { path = "../../qomm/rust/qomm-dsl" }
qomm-sim = { path = "../../qomm/rust/qomm-sim" }
qomm-mpc = { path = "../../qomm/rust/qomm-mpc" }
qomm-transport = { path = "../../qomm/rust/qomm-transport" }
qomm-audit = { path = "../../qomm/rust/qomm-audit" }
qomm-measure = { path = "../../qomm/rust/qomm-measure" }

# Unpublished integration overlay; see zkfmi-crypto/docs/INTEGRATION_SOURCES.json.
[patch."https://github.com/zkFMI/zkpi.git"]
qomm-proofs = { path = "../../zkpi/rust/qomm-proofs" }
qomm-zk = { path = "../../zkpi/rust/qomm-zk" }
qomm-zkpi = { path = "../../zkpi/rust/qomm-zkpi" }

# Unpublished integration overlay; see zkfmi-crypto/docs/INTEGRATION_SOURCES.json.
[patch."https://github.com/zkFMI/defmi.git"]
qomm-defmi = { path = "qomm-defmi" }
zkpi-defmi-sdk = { path = "zkpi-defmi-sdk" }
qomm-avalanche-vm = { path = "qomm-avalanche-vm" }

# Unpublished integration overlay; see zkfmi-crypto/docs/INTEGRATION_SOURCES.json.
[patch."https://github.com/zkFMI/dekyx.git"]
dekyx-core = { path = "../../dekyx/crates/dekyx-core" }
