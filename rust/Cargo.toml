[workspace]
resolver = "2"
members = ["qomm-defmi", "qomm-proofs", "qomm-zk", "qomm-zkpi", "qomm-measure", "qomm-sim", "qomm-dsl", "qomm-mpc", "qomm-transport", "qomm-audit", "qomm-avalanche-vm", "zkpi-defmi-sdk", "qomm-harness"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
dekyx-core = { git = "https://github.com/shukob/dekyx.git", rev = "67eb59a1548740d15585a42d9cff8bc06ae95c5e" }
# Audited by Quarkslab (2019, commissioned by Tari Labs, 30 man-days) together
# with subtle and bulletproofs. 4.1.3 is the first release carrying the fix for
# RUSTSEC-2024-0344, a timing leak LLVM introduced into Scalar::sub, so the
# floor is not negotiable.
curve25519-dalek = { version = "4.1.3", features = ["rand_core", "digest"] }
bulletproofs = "5.0"
merlin = "3"
sha2 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
subtle = "2.5"
# Threshold Schnorr from the Zcash Foundation, partially audited by NCC Group
# (2023, v0.6.0). Replaces a hand-rolled threshold sigma protocol.
frost-ristretto255 = "3.0"
frost-core = "3.0"
# Ed25519 signatures for the KYB issuer. Same dalek assessment as the group.
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
base64 = "0.22"
hex = "0.4"
thiserror = "1"
rand = "0.8"
regex = "1.13.1"
openssl = "0.10"
libc = "0.2"
qomm-zk = { path = "qomm-zk" }
qomm-zkpi = { path = "qomm-zkpi" }
qomm-proofs = { path = "qomm-proofs" }
qomm-defmi = { path = "qomm-defmi" }
qomm-dsl = { path = "qomm-dsl" }
qomm-sim = { path = "qomm-sim" }
qomm-measure = { path = "qomm-measure" }
qomm-mpc = { path = "qomm-mpc" }
qomm-transport = { path = "qomm-transport" }
zkpi-defmi-sdk = { path = "zkpi-defmi-sdk" }
qomm-audit = { path = "qomm-audit" }
aethel-core = { git = "https://github.com/shukob/aethel" }
