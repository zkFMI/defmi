[package]
name = "avalanche-rpcchainvm-qomm"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false
description = "QOMM-maintained Avalanche RPCChainVM protocol-45 Rust bindings"
license-file = "../../../LICENSE"
repository = "https://github.com/ava-labs/avalanche-rs"
build = "build.rs"

[dependencies]
bytes = "1"
prost = "0.13"
prost-types = "0.13"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = { version = "0.12", features = ["transport"] }
tonic-health = "0.12"

[build-dependencies]
protoc-bin-vendored = "3"
tonic-build = "0.12"
